<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snigel — Marknadspositionering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header id="app-header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 20l2-2m0 0l4-4m-4 4l-2-2m2 2l4 4"/>
          <path d="M6 16l6-6"/>
          <path d="M12 10l4-4a2.83 2.83 0 114 4l-4 4"/>
          <path d="M16 6l2-2"/>
          <circle cx="18" cy="4" r="1"/>
        </svg>
      </div>
      <div>
        <h1>Snigel Marknadspositionering</h1>
        <p class="subtitle">Konkurrensanalys & Strategisk Positionering</p>
      </div>
    </div>
    <nav class="header-nav">
      <button class="nav-btn active" data-view="tree" onclick="switchView('tree')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg>
        Beslutsträd
      </button>
      <button class="nav-btn" data-view="profiles" onclick="switchView('profiles')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Företagsprofiler
      </button>
      <button class="nav-btn" data-view="compare" onclick="switchView('compare')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Jämför
      </button>
      <button class="nav-btn" data-view="scenarios" onclick="switchView('scenarios')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Scenarion
      </button>
      <button class="nav-btn" data-view="personas" onclick="switchView('personas')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Personas
      </button>
      <button class="nav-btn" data-view="simulator" onclick="switchView('simulator')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Simulator
      </button>
      <button class="nav-btn" data-view="visualizations" onclick="switchView('visualizations')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        Visualiseringar
      </button>
      <button class="nav-btn" data-view="documents" onclick="switchView('documents')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Dokument
      </button>
      <button class="nav-btn" data-view="changelog" onclick="switchView('changelog')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
        Ändringslogg
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="app-main">
    <!-- TREE VIEW -->
    <div id="view-tree" class="view active">
      <div class="tree-layout">
        <div class="tree-panel" id="tree-container"></div>
        <div class="detail-panel" id="detail-panel">
          <div class="detail-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
              <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
            </svg>
            <h3>Välj en analysnod</h3>
            <p>Klicka på en nod för att se detaljerad analys, konkurrenspoäng och marknadsvektorer. Använd AI-assistenten för att utforska positioneringsstrategier.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- PROFILES VIEW -->
    <div id="view-profiles" class="view">
      <div class="profiles-container" id="profiles-container"></div>
    </div>

    <!-- COMPARE VIEW -->
    <div id="view-compare" class="view">
      <div class="compare-container" id="compare-container"></div>
    </div>

    <!-- SCENARIOS VIEW -->
    <div id="view-scenarios" class="view">
      <div class="scenarios-container" id="scenarios-container"></div>
    </div>

    <!-- PERSONAS VIEW -->
    <div id="view-personas" class="view">
      <div class="personas-container" id="personas-container"></div>
    </div>

    <!-- SIMULATOR VIEW -->
    <div id="view-simulator" class="view">
      <div class="simulator-container" id="simulator-container"></div>
    </div>

    <!-- VISUALIZATIONS VIEW -->
    <div id="view-visualizations" class="view">
      <div class="visualizations-container" id="visualizations-container"></div>
    </div>

    <!-- DOCUMENTS VIEW -->
    <div id="view-documents" class="view">
      <div class="documents-container" id="documents-container"></div>
    </div>

    <!-- CHANGE LOG VIEW -->
    <div id="view-changelog" class="view">
      <div class="compare-container" id="changelog-container"></div>
    </div>
  </main>

  <!-- Edit Score Modal -->
  <div id="edit-modal-overlay" class="modal-overlay" onclick="closeEditModal()"></div>
  <div id="edit-modal" class="edit-modal">
    <div class="edit-modal-header">
      <h3>Redigera poäng</h3>
      <button class="close-btn" onclick="closeEditModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="edit-modal-body">
      <div class="edit-modal-context">
        <span id="edit-modal-company" class="edit-modal-company"></span>
        <span id="edit-modal-node" class="edit-modal-node"></span>
      </div>
      <div class="edit-field">
        <label>Poäng</label>
        <div class="edit-score-row">
          <input type="range" id="edit-score-slider" min="0" max="10" step="0.5" value="5" oninput="updateScorePreview(this.value)">
          <span id="edit-score-value" class="edit-score-display">5</span>
          <span class="edit-score-max">/ 10</span>
        </div>
      </div>
      <div id="edit-impact-preview" class="edit-impact-preview"></div>
      <div class="edit-field">
        <label>Uppdaterad motivering</label>
        <textarea id="edit-rationale" rows="3" placeholder="Beskriv resonemanget bakom denna poäng..."></textarea>
      </div>
      <div class="edit-field">
        <label>Anledning till ändring <span class="required">*obligatorisk</span></label>
        <textarea id="edit-motivation" rows="3" placeholder="Varför ändrar du denna poäng? Vilken ny information eller resonemang stöder ändringen?"></textarea>
      </div>
      <div class="edit-modal-actions">
        <button class="score-action-btn" onclick="closeEditModal()">Avbryt</button>
        <button class="score-action-btn primary" id="edit-save-btn" onclick="saveEdit()">Spara ändring</button>
      </div>
    </div>
  </div>

  <!-- AI Chat Slide-over -->
  <div id="ai-overlay" class="ai-overlay" onclick="closeAIPanel()"></div>
  <div id="ai-panel" class="ai-panel">
    <div class="ai-header">
      <div>
        <h3>AI-analys</h3>
        <p id="ai-context-label" class="ai-context-label">Snigel AI-rådgivare</p>
      </div>
      <button class="close-btn" onclick="closeAIPanel()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="ai-messages" id="ai-messages"></div>
    <div class="ai-input-area">
      <div class="ai-quick-actions" id="ai-quick-actions"></div>
      <div class="ai-input-row">
        <textarea id="ai-input" placeholder="Fråga om denna nod, ifrågasätt en poäng, eller utforska strategier..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
        <button class="send-btn" onclick="sendMessage()" id="send-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
